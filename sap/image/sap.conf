# /etc/sap.conf: SAP, the SiliconForest system updater (docs/sap/README.md). Unknown keys are ignored.
channel = stable
# manifest_url = https://<the channel's host>/v1/stable/manifest.json   (set by the image build)
sfboot = /Volumes/SFBOOT
boot_backend = auto
bootslot_tool = /usr/libexec/sf-bootslot
require_ac = yes
# health_services = org.siliconforest.desktop   (besides the services the installed packages name)
