name: Public Nix build entry
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Evaluate the flake and build its public source manifest
        # The pinned public image provides only Nix and bootstrap packages.
        # Full cross builds need much more disk, RAM and time, or a binary cache.
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f \
            sh -ec '
              export NIX_CONFIG="experimental-features = nix-command flakes"
              nix eval path:/work#packages.x86_64-linux.source-manifest.drvPath
              nix build --no-link path:/work#source-manifest
            '
