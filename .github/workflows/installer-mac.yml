name: Installer macOS tests

# Image-backed engine, helper XPC, and recovery-link tests. Nothing here writes
# to a real disk, and the real-disk write compile-time gate stays unset.
on:
  push:
    paths:
      - "installer/mac/**"
      - "!installer/mac/SFExt4Grow/**"
      - "installer/profiles/**"
      - ".github/workflows/installer-mac.yml"
  pull_request:
    paths:
      - "installer/mac/**"
      - "!installer/mac/SFExt4Grow/**"
      - "installer/profiles/**"
      - ".github/workflows/installer-mac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SFInstallKit tests (unit tests only)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the Apple-silicon macOS runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          swift --version

      - name: Run installer tests
        working-directory: installer/mac
        shell: bash
        env:
          # CI tier: unit tests only. Every image-backed test (installs, resizes, sweeps, repeats, and
          # the pre-write refusals that still attach an APFS image) is the long tier and runs on the M5
          # (installer/mac/scripts/test-long.sh). On macos-15, hdiutil/diskutil/APFS are ~20x slower than
          # the M5: even the short refusals take minutes (planBinding 88 s on run 45504226352), and run
          # 45560301367 was still going at 16 min with only those five left on CI. SF_IMAGE_TESTS=0 is
          # the suite-level switch so a new untagged image test cannot blow the 10-15 min budget.
          SF_IMAGE_TESTS: "0"
          SF_IMAGE_LONG: "0"
        run: |
          set -euo pipefail
          unset SF_REAL_DISK_WRITES || true
          unset SF_ALLOW_REAL_DISK_WRITES || true
          if [[ -n "${SF_REAL_DISK_WRITES:-}" || -n "${SF_ALLOW_REAL_DISK_WRITES:-}" ]]; then
            echo "Real-disk write gates must stay unset in CI." >&2
            exit 1
          fi
          scripts/test.sh

  app:
    # Built in parallel with the tests so the two don't add up.
    name: Ad-hoc app, helper and recovery layout
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build an ad-hoc app and verify helper and recovery layout
        working-directory: installer/mac
        shell: bash
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: "-"
        run: |
          set -euo pipefail
          unset SF_REAL_DISK_WRITES || true
          unset SF_ALLOW_REAL_DISK_WRITES || true
          scripts/make-app.sh
          scripts/verify-signed-app.sh "build/SiliconForest Installer.app"
          # The real-disk compile key must be off: no InternalDiskAuthority anywhere in the app.
          scripts/check-real-disk-gate.sh "build/SiliconForest Installer.app"

  stub:
    # SFStub (Swift port of Asahi v0.9.2's stub builder) against a synthetic restore
    # image built in the tests: no Apple bits, no disks, no root. The differential test
    # against Asahi on Apple's real image is skipped here with its reason; it runs on the
    # M5 via scripts/stub-differential.sh.
    name: SFStub tests (synthetic IPSW, no Apple bits)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run the SFStub suites
        working-directory: installer/mac
        shell: bash
        run: |
          set -euo pipefail
          unset SF_REAL_DISK_WRITES || true
          unset SF_ALLOW_REAL_DISK_WRITES || true
          swift build --product sfstubctl
          swift test --no-parallel --filter 'StubReaderTests|StubBuildTests'

      - name: Check the differential-test scripts parse
        working-directory: installer/mac
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tests/StubDifferential/asahi_oracle.py Tests/StubDifferential/stubtree.py
          bash -n scripts/stub-differential.sh
