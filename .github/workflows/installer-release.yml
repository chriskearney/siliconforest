name: Installer release

# Builds, Developer ID-signs, notarizes and staples the macOS installer app, the lab tools
# (sfinstrun, sfstubrun) with the real-disk compile key, and sf-stage1.bin from source.
# A tag push (installer-v*) publishes a prerelease (DMG, hashes, stage 1). The signed payload
# (install.json, root, boot files, kernel-collection inputs, SHA256SUMS.sig) is assembled
# offline with the release key and uploaded to the same GitHub release afterwards. The private
# key is never in CI. Manual dispatch builds, signs and notarizes only and does not publish.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no installer-v prefix)"
        required: true
        default: "0.1.0-preview5"
        type: string

permissions:
  contents: write

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            version="${GITHUB_REF_NAME}"
            version="${version#installer-v}"
          else
            version="${REQUESTED_VERSION}"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid installer version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=installer-v${version}" >> "$GITHUB_OUTPUT"

  stage1:
    name: Build sf-stage1.bin from source
    # The stub's stage 1 (Omacom m1n1 at the profile's pin plus our patch), built the way the installed
    # machine's stage 1 was (installer/payload/boot/build_stage1.sh). The script refuses any build that is
    # not byte-identical to the installed stage 1 (a different stage 1 is a new install). Nothing here
    # is signed, and the file is never committed. Manual dispatch builds it and keeps it as an artifact.
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools (LLVM 22, ImageMagick, librsvg)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q make git imagemagick librsvg2-bin python3
          wget -q https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22 all
          # unversioned clang, ld.lld, llvm-objcopy, llvm-config (m1n1's Makefile uses these names)
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          export PATH=/usr/lib/llvm-22/bin:$PATH
          # Ubuntu's ImageMagick 6 has `convert`, not `magick`; the logo step only flattens and dumps pixels
          command -v magick >/dev/null || sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          clang --version | head -1
          ld.lld --version | head -1
          llvm-objcopy --version | head -1

      - name: Rust 1.98.1 with the bare-metal target, at the lab's paths
        # The installed stage 1 was built by the lab's rustup toolchain (stable, rustc 1.98.1, rust-src installed)
        # under /home/chrisk, and rustc embeds the source paths of the crates it builds (panic locations).
        # A build is byte-identical only if those paths are the same, so the toolchain and the cargo home
        # are put at the same paths. Nothing else about the path matters (the m1n1 tree is in a temp directory).
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /home/chrisk
          sudo chown "$USER" /home/chrisk
          export RUSTUP_HOME=/home/chrisk/.rustup CARGO_HOME=/home/chrisk/.cargo
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-unknown-none-softfloat --component rust-src
          mv "$RUSTUP_HOME/toolchains/1.98.1-x86_64-unknown-linux-gnu" "$RUSTUP_HOME/toolchains/stable-x86_64-unknown-linux-gnu"
          tc="$RUSTUP_HOME/toolchains/stable-x86_64-unknown-linux-gnu"
          {
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "$tc/bin"
          } > "$RUNNER_TEMP/rust-env"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$tc/bin" >> "$GITHUB_PATH"
          "$tc/bin/rustc" --version
          "$tc/bin/cargo" --version

      - name: Fetch m1n1 at the profile's pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import json; print(json.load(open("installer/profiles/J313.json"))["boot"]["stage1"]["source_revision"])')"
          git clone --quiet https://github.com/omacom/m1n1 "$RUNNER_TEMP/m1n1"
          git -C "$RUNNER_TEMP/m1n1" checkout --quiet "$pin"
          git -C "$RUNNER_TEMP/m1n1" submodule update --init --recursive --quiet
          [[ "$(git -C "$RUNNER_TEMP/m1n1" rev-parse HEAD)" == "$pin" ]]
          echo "SF_M1N1_SRC=$RUNNER_TEMP/m1n1" >> "$GITHUB_ENV"

      - name: Build sf-stage1.bin
        shell: bash
        env:
          SF_CARGO_ONLINE: "1"
        run: |
          set -euo pipefail
          installer/payload/boot/build_stage1.sh "$RUNNER_TEMP/stage1"
          cd "$RUNNER_TEMP/stage1"
          sha256sum sf-stage1.bin | tee sf-stage1.bin.sha256
          python3 -c 'import json; r=json.load(open("sf-stage1.json")); assert r["same_as_installed_stage1"] is True, r'

      - name: Build log (on failure)
        if: failure()
        shell: bash
        run: |
          grep -n -i -E 'error|undefined|not found|cannot|fatal|\*\*\*' "$RUNNER_TEMP/stage1/sf-stage1.log" | grep -v 'warning' | head -60 || true

      - name: Upload sf-stage1 (release input)
        uses: actions/upload-artifact@v4
        with:
          name: sf-stage1
          path: |
            ${{ runner.temp }}/stage1/sf-stage1.bin
            ${{ runner.temp }}/stage1/sf-stage1.bin.sha256
            ${{ runner.temp }}/stage1/sf-stage1.json
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Signed and notarized installer DMG (Apple silicon)
    needs: [validate, stage1]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      INSTALLER_VERSION: ${{ needs.validate.outputs.version }}
      INSTALLER_TAG: ${{ needs.validate.outputs.tag }}
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the Apple-silicon macOS runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          xcodebuild -version
          swift --version
          xcrun notarytool --version

      - name: Run installer tests (no disk images)
        working-directory: installer/mac
        shell: bash
        env:
          # Image fault-injection exceeded the 90-minute job limit on macos-15
          # (run 45487572388). Full image suites stay in installer-mac.yml.
          SF_IMAGE_TESTS: "0"
        run: |
          set -euo pipefail
          unset SF_REAL_DISK_WRITES || true
          unset SF_ALLOW_REAL_DISK_WRITES || true
          if [[ -n "${SF_REAL_DISK_WRITES:-}" || -n "${SF_ALLOW_REAL_DISK_WRITES:-}" ]]; then
            echo "Real-disk write gates must stay unset in CI." >&2
            exit 1
          fi
          scripts/test.sh

      - name: Preserve the runner keychain configuration
        shell: bash
        run: |
          set -euo pipefail
          keychain_list="$RUNNER_TEMP/original-user-keychains.txt"
          default_keychain="$RUNNER_TEMP/original-default-keychain.txt"
          security list-keychains -d user \
            | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$keychain_list"
          security default-keychain -d user \
            | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$default_keychain"
          echo "MAC_ORIGINAL_KEYCHAIN_LIST=$keychain_list" >> "$GITHUB_ENV"
          echo "MAC_ORIGINAL_DEFAULT_KEYCHAIN=$default_keychain" >> "$GITHUB_ENV"

      - name: Resolve Apple signing capability
        id: apple-signing
        shell: bash
        run: |
          set -euo pipefail
          import_certificate=false
          if [[ -n "$MAC_CERTIFICATE_P12_BASE64" && \
                -n "$MAC_CERTIFICATE_PASSWORD" && \
                -n "$MAC_SIGNING_IDENTITY" ]]; then
            import_certificate=true
          elif ! security find-identity -v -p codesigning \
              | grep -q 'Developer ID Application:'; then
            echo "A Developer ID Application identity is required." >&2
            echo "Configure the MAC_CERTIFICATE_* secrets or install the identity on the runner." >&2
            exit 1
          fi

          api_values=0
          [[ -n "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]] && ((api_values += 1))
          [[ -n "${APP_STORE_CONNECT_KEY_ID:-}" ]] && ((api_values += 1))
          [[ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]] && ((api_values += 1))
          apple_values=0
          [[ -n "${APPLE_ID:-}" ]] && ((apple_values += 1))
          [[ -n "${APPLE_APP_PASSWORD:-}" ]] && ((apple_values += 1))
          [[ -n "${APPLE_TEAM_ID:-}" ]] && ((apple_values += 1))
          if [[ "$api_values" -ne 3 && "$apple_values" -ne 3 ]]; then
            echo "Complete App Store Connect API or Apple-ID notarization credentials are required." >&2
            exit 1
          fi
          echo "import_certificate=$import_certificate" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: steps.apple-signing.outputs.import_certificate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/sf-installer-signing.p12"
          keychain_path="$RUNNER_TEMP/sf-installer-signing.keychain-db"
          keychain_password="$(uuidgen)"
          CERT_PATH="$cert_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["MAC_CERTIFICATE_P12_BASE64"])
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          curl -fsSL https://www.apple.com/appleca/AppleIncRootCertificate.cer \
            -o "$RUNNER_TEMP/AppleIncRootCertificate.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/AppleIncRootCertificate.cer" -A -k "$keychain_path"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -A -k "$keychain_path"
          security import "$cert_path" -P "$MAC_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" "/Library/Keychains/System.keychain"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          echo "MAC_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$cert_path"

      - name: Install App Store Connect key for notarization
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/notary-private-keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          KEY_PATH="$key_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_BASE64"])
          )
          PY
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and sign the installer app
        working-directory: installer/mac
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          SWIFT_DEFINES: SF_REAL_DISK_WRITES
        run: |
          set -euo pipefail
          [[ -n "$SIGN_IDENTITY" && "$SIGN_IDENTITY" != "-" ]]
          # The compile key is a -D flag only. Do not export SF_REAL_DISK_WRITES as an env var
          # (check-real-disk-gate.sh treats that as a failure).
          unset SF_REAL_DISK_WRITES SF_ALLOW_REAL_DISK_WRITES || true
          scripts/make-app.sh
          app="build/SiliconForest Installer.app"
          test -d "$app"
          scripts/verify-signed-app.sh --developer-id "$app"
          test -x build/lab/sfinstrun && test -x build/lab/sfstubrun
          scripts/check-real-disk-gate.sh --expect-compiled build/lab/sfinstrun build/lab/sfstubrun "$app/Contents/MacOS/SFHelper"
          echo "---- app ----"
          codesign -dvv "$app"
          echo "---- helper ----"
          codesign -dvv "$app/Contents/MacOS/SFHelper"
          echo "---- recovery ----"
          codesign -dvv "$app/Contents/Helpers/SFRecovery"
          echo "---- sfinstrun ----"
          codesign -dvv build/lab/sfinstrun
          echo "---- sfstubrun ----"
          codesign -dvv build/lab/sfstubrun

      - name: Build and Developer ID-sign kc-builder
        # The installer's kernel-collection linker (PAYLOAD.md section 13): PureDarwin kc-tools,
        # BSD-3-Clause, built from source here and shipped as its own hashed release file. It is
        # an open-source tool with no Apple parts; the collections it links are never uploaded.
        shell: bash
        env:
          KC_SIGN_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [[ -n "$KC_SIGN_IDENTITY" && "$KC_SIGN_IDENTITY" != "-" ]]
          if [[ -n "${MAC_KEYCHAIN_PATH:-}" ]]; then export KC_SIGN_KEYCHAIN="$MAC_KEYCHAIN_PATH"; fi
          out="installer/mac/build/kc-builder"
          integrations/siliconforest/kc-builder/build-macos.sh "$out"
          [[ "$(cat "$out/kc-builder.signing")" == developer-id ]]
          codesign --verify --strict --verbose=2 "$out/kc-builder"
          details="$(codesign -dvv "$out/kc-builder" 2>&1)"
          echo "$details" | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          echo "$details" | grep -q '^Authority=Developer ID Application:'
          echo "$details" | grep -q 'flags=0x10000(runtime)'
          lipo -archs "$out/kc-builder" | grep -qx arm64
          # Same source and patches as the Linux build: the cross-platform digest must agree.
          python3 integrations/siliconforest/kc-builder/test_sym_order.py --digest | tee "$out/sym-order-digest.txt"
          grep -qx 'sym-order-digest 0892d7d86ab47e7d' "$out/sym-order-digest.txt"

      - name: Fetch sf-stage1.bin and check it against the profile and the installed stage 1
        uses: actions/download-artifact@v4
        with:
          name: sf-stage1
          path: installer/mac/build/stage1

      - name: Check sf-stage1.bin
        shell: bash
        run: |
          set -euo pipefail
          d=installer/mac/build/stage1
          pin="$(python3 -c 'import json; b=json.load(open("installer/profiles/J313.json"))["boot"]["stage1"]; print(b["source_revision"], b["max_stage2_span_bytes"])')"
          python3 installer/payload/release/sfrelease.py check-stage1 "$d/sf-stage1.bin" \
            --revision "${pin% *}" --footprint "${pin#* }"
          (cd "$d" && shasum -a 256 -c sf-stage1.bin.sha256)
          want="$(grep -o 'STAGE1_INSTALLED=[0-9a-f]*' installer/payload/boot/build_stage1.sh | cut -d= -f2)"
          got="$(shasum -a 256 "$d/sf-stage1.bin" | cut -d' ' -f1)"
          [[ "$want" == "$got" ]] || { echo "sf-stage1.bin $got is not the installed stage 1 $want" >&2; exit 1; }
          echo "sf-stage1.bin $got ($(wc -c < "$d/sf-stage1.bin") bytes) is the installed stage 1"

      - name: Package, sign, notarize and staple the DMG
        shell: bash
        run: |
          set -euo pipefail
          app="installer/mac/build/SiliconForest Installer.app"
          dist="installer/mac/build/dist"
          mkdir -p "$dist"
          dmg="$dist/SiliconForest-Installer-${INSTALLER_VERSION}.dmg"
          staging="$dist/dmg-staging"
          rm -rf "$staging" "$dmg"
          mkdir -p "$staging"
          ditto "$app" "$staging/SiliconForest Installer.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "$staging/Lab tools"
          cp installer/mac/build/lab/sfinstrun installer/mac/build/lab/sfstubrun \
            installer/mac/build/lab/allowed_signers "$staging/Lab tools/"
          python3 - <<PY
          from pathlib import Path
          Path("$staging/READ ME FIRST.txt").write_text("""SiliconForest Installer ${INSTALLER_VERSION}

          THIS APP PERFORMS A REAL INSTALL. IT REPARTITIONS THIS MAC'S INTERNAL DISK.

          Back up first. It has not been run on a real Mac before this release.

          1. Drag "SiliconForest Installer" to Applications and open it from there.
          2. Allow its helper when macOS asks (System Settings > General > Login Items).
          3. Follow the app: it checks this Mac, fetches and verifies the signed payload,
             shows the plan, and asks you to type your disk's name, the erase phrase and
             your administrator password before anything is written.
          4. The last step, bless, is a command you run yourself in Terminal. The final
             screen shows it, then how to start up from SiliconForest.

          If the app or the Mac stops mid-install, open the app again: it offers to
          continue or to undo. Steps: docs/installer/FIRST-INSTALL-J313.md.

          Lab tools: sfinstrun (the same engine from Terminal, with a hand-written
          authorization file) and sfstubrun (stub only). There is no pkg and no
          Developer ID Installer certificate. Do not run bputil, kmutil or DFU yourself.
          """.replace("${INSTALLER_VERSION}", __import__("os").environ["INSTALLER_VERSION"]))
          PY
          dmg_created=false
          for attempt in 1 2 3; do
            if hdiutil create -volname "SiliconForest Installer" -srcfolder "$staging" \
                -ov -format UDZO "$dmg"; then
              dmg_created=true
              break
            fi
            echo "DMG creation attempt ${attempt} failed; retrying." >&2
            sleep 5
          done
          if [[ "$dmg_created" != true ]]; then
            echo "Unable to create the DMG after three attempts." >&2
            exit 1
          fi
          hdiutil verify "$dmg"

          identity="$MAC_SIGNING_IDENTITY"
          dmg_codesign=(--force --timestamp --sign "$identity")
          if [[ -n "${MAC_KEYCHAIN_PATH:-}" ]]; then
            dmg_codesign+=(--keychain "$MAC_KEYCHAIN_PATH")
          fi
          codesign "${dmg_codesign[@]}" "$dmg"
          codesign --verify --verbose=2 "$dmg"

          notary_args=()
          api_values=(
            "${APP_STORE_CONNECT_API_KEY_PATH:-}"
            "${APP_STORE_CONNECT_KEY_ID:-}"
            "${APP_STORE_CONNECT_ISSUER_ID:-}"
          )
          api_count=0
          for value in "${api_values[@]}"; do
            [[ -n "${value}" ]] && ((api_count += 1))
          done
          if (( api_count == 3 )); then
            [[ -f "${APP_STORE_CONNECT_API_KEY_PATH}" ]] || {
              echo "App Store Connect private key not found: ${APP_STORE_CONNECT_API_KEY_PATH}" >&2
              exit 1
            }
            notary_args=(
              --key "${APP_STORE_CONNECT_API_KEY_PATH}"
              --key-id "${APP_STORE_CONNECT_KEY_ID}"
              --issuer "${APP_STORE_CONNECT_ISSUER_ID}"
            )
          elif (( api_count != 0 )); then
            echo "App Store Connect notarization requires key path, key ID, and issuer ID." >&2
            exit 1
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            notary_args=(
              --apple-id "${APPLE_ID}"
              --password "${APPLE_APP_PASSWORD}"
              --team-id "${APPLE_TEAM_ID}"
            )
          else
            echo "Notarization credentials are incomplete." >&2
            exit 1
          fi

          result="$dist/notary-result.json"
          xcrun notarytool submit "$dmg" "${notary_args[@]}" \
            --wait --output-format json | tee "$result"
          status="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$result")"
          submission_id="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$result")"
          echo "NOTARY_STATUS=$status" >> "$GITHUB_ENV"
          echo "NOTARY_SUBMISSION_ID=$submission_id" >> "$GITHUB_ENV"
          echo "Notarization status=$status id=$submission_id"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$submission_id" "${notary_args[@]}" || true
            echo "Apple notarization did not accept the DMG: $status" >&2
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$dmg"
          (cd "$dist" && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: siliconforest-installer-macos
          path: |
            installer/mac/build/dist/*.dmg
            installer/mac/build/dist/*.sha256
            installer/mac/build/dist/notary-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the signed kc-builder (release input, not a collection)
        uses: actions/upload-artifact@v4
        with:
          name: siliconforest-kc-builder-macos-arm64
          path: |
            installer/mac/build/kc-builder/kc-builder
            installer/mac/build/kc-builder/kc-builder.sha256
            installer/mac/build/kc-builder/kc-builder.signing
            installer/mac/build/kc-builder/LICENSE.kc-tools
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        # Manual workflow_dispatch only builds, signs, notarizes and uploads Actions artifacts.
        # A GitHub prerelease (and its installer-v* tag) is created or updated only from a tag push.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/installer-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$INSTALLER_TAG"
          version="$INSTALLER_VERSION"
          title="SiliconForest Installer ${version} (real-disk preview)"
          dist=installer/mac/build/dist
          s1=installer/mac/build/stage1
          cp "$s1/sf-stage1.bin" "$s1/sf-stage1.json" "$s1/sf-stage1.bin.sha256" "$dist/"
          dmg_name="$(basename "$DMG")"
          s1_sha="$(shasum -a 256 "$dist/sf-stage1.bin" | cut -d' ' -f1)"
          s1_bytes="$(wc -c < "$dist/sf-stage1.bin" | tr -d ' ')"
          s1_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version_tag"])' "$dist/sf-stage1.json")"
          (cd "$dist" && shasum -a 256 "$dmg_name" sf-stage1.bin sf-stage1.json > RELEASE-SHA256SUMS)
          dmg_sha="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          **This app performs a real install. It repartitions this Mac's internal disk: it shrinks the macOS container and writes the SiliconForest partitions. Back up first (Time Machine or another full backup), and have a way to reinstall macOS. It has not been run on a real Mac before this release.**

          What the app does: checks this Mac (supported model, macOS, FileVault off, power, free space), lets you choose the size, fetches this release's signed payload from GitHub and verifies `SHA256SUMS.sig` against the bundled `allowed_signers` before anything is written, shows the exact plan, and asks you to type your macOS disk's name and the erase phrase (for example `ERASE 60 GB`), then for an administrator's password. Its privileged helper (installed with your approval in System Settings › Login Items) then writes a runtime authorization for exactly that plan and disk, valid for at most 2 hours, and runs the install with live progress. If the app or the Mac stops, open the app again: it offers to continue or to undo. The last step, `bless`, is a command you run yourself in Terminal; the final screen shows it and the startup-options steps.

          Requirements: the app in `/Applications`; FileVault off; the compile key `SF_REAL_DISK_WRITES` is in this build, and nothing writes without your typed confirmation and administrator approval. Stage 1 is pinned to v1 (`44c1ef0b…`). The lab tools (`sfinstrun`, `sfstubrun`, under Lab tools in the DMG) still work with a hand-written authorization file.

          Built from commit \`${GITHUB_SHA}\`. The signed payload (`install.json`, the root, `boot.bin`, the kernel-collection files, `SHA256SUMS.sig`) is assembled offline with the release key and uploaded to this GitHub release after this job; the key is never in CI. Verify the payload with `verify_release.py` in a directory that contains only those payload files (not the DMG).

          ## What is in this job's assets

          | File | What | SHA-256 |
          |---|---|---|
          | \`${dmg_name}\` | The installer app, `sfinstrun`, `sfstubrun` and `allowed_signers`. Developer ID signed with the hardened runtime, notarized and stapled; team \`Z642ZK8JK4\`. DMG only: no pkg, no Developer ID Installer certificate | \`${dmg_sha}\` |
          | \`sf-stage1.bin\` | The stub's stage 1, ${s1_bytes} bytes, built from source in this run: Omacom m1n1 at the profile's pin plus our stage 1 patch, version tag \`${s1_tag}\`. Byte-identical to the installed stage 1, and the job fails if it is not | \`${s1_sha}\` |
          | \`sf-stage1.json\` | Provenance of that build | |
          | \`sf-stage1.bin.sha256\`, \`RELEASE-SHA256SUMS\` | Hashes of the files above | |

          ## What is not produced by this job

          - The signed payload (`install.json`, `boot.bin`, `bootargs.template`, the root parts, the kernel-collection files, `SHA256SUMS` / `SHA256SUMS.sig`) is assembled offline and uploaded to this release after this job. Until then, this tag's release has only the DMG and stage 1.
          - **No Apple binaries or firmware.** The stub's macOS 13.5 files are read from Apple's CDN at run time and checked against the profile's names and hashes before any write. No Wi-Fi firmware is extracted yet: the firmware slot is left empty, so Wi-Fi stays off in SiliconForest.

          **This app writes to your Mac's internal disk. Back up first. This build has had no real-hardware run.**
          EOF
          assets=("$dist"/*.dmg "$dist/${dmg_name}.sha256" "$dist/sf-stage1.bin" "$dist/sf-stage1.json" "$dist/sf-stage1.bin.sha256" "$dist/RELEASE-SHA256SUMS")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "$notes" --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file "$notes" --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          set +e
          original_keychains=()
          if [[ -s "${MAC_ORIGINAL_KEYCHAIN_LIST:-}" ]]; then
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$MAC_ORIGINAL_KEYCHAIN_LIST"
          fi
          if [[ "${#original_keychains[@]}" -gt 0 ]]; then
            security list-keychains -d user -s "${original_keychains[@]}"
          else
            security list-keychains -d user -s "/Library/Keychains/System.keychain"
          fi
          if [[ -s "${MAC_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
            original_default="$(head -n 1 "$MAC_ORIGINAL_DEFAULT_KEYCHAIN")"
            [[ -n "$original_default" ]] && security default-keychain -s "$original_default"
          else
            security default-keychain -s "/Library/Keychains/System.keychain"
          fi
          if [[ -n "${MAC_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MAC_KEYCHAIN_PATH" 2>/dev/null
          fi
          rm -f "$RUNNER_TEMP"/sf-installer-signing.p12
          rm -rf "$RUNNER_TEMP"/notary-private-keys
          true
