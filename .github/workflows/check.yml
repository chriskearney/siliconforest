name: Check development tooling
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build Recovery checksum tools
        run: bash scripts/build-recovery-tools.sh
      - name: Install host verification tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools gnupg shellcheck gcc libwayland-dev
      - run: make check
