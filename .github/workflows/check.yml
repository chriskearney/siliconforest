name: Check development tooling
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install host verification tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools gnupg shellcheck
      - run: make check
