name: Offline laboratory contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: clang
            flags: --sanitize --cross
          - cc: gcc
            flags: ""
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test Python tools and C contracts with sanitizers
        # tools/ci_check.py runs tools/check.py unchanged and accepts exactly one known test
        # that needs build artefacts which are not in git; it reports that test as NOT RUN.
        run: python3 tools/ci_check.py --cc ${{ matrix.cc }} ${{ matrix.flags }}
      - name: Lint the installer's shell scripts
        if: matrix.cc == 'gcc'
        # shellcheck is part of GitHub's ubuntu-24.04 runner image
        run: shellcheck -s sh install.sh install/bootstrap.sh
      - name: Check deliberately broken variants
        if: matrix.cc == 'clang'
        run: |
          python3 tools/check_mutations.py --cc clang
          python3 tools/check_mutations.py --cc clang --suite mapping-ticket --build-dir .build/mapping-mutations --report .build/mapping-mutations.json
          python3 tools/cross_abi.py --spec specs/mapping-layout-probe.json --build-dir .build/mapping-abi --report .build/mapping-abi.json
          python3 tools/check_mutations.py --cc clang --suite memory-probe --build-dir .build/probe-mutations --report .build/probe-mutations.json
          python3 tools/check_mutations.py --cc clang --suite memory-probe-result --build-dir .build/result-mutations --report .build/result-mutations.json
          python3 tools/cross_abi.py --spec specs/probe-protocol-layout-probe.json --build-dir .build/probe-protocol-abi --report .build/probe-protocol-abi.json
      - name: Validate metadata and ensure hardware execution remains blocked
        run: |
          python3 tools/lab.py validate
          python3 tools/lab.py plan > .build/hardware-plan.json
          python3 -c 'import json; p=json.load(open(".build/hardware-plan.json")); assert p["execution_permitted"] is False'
# No self-hosted runners, firmware, secrets, network source fetch, or boot tests.
