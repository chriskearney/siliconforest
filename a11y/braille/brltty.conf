# brltty.conf — SiliconForest universal Braille display configuration
# Copyright (c) 2026 The SiliconForest Project, SPDX-License-Identifier: MPL-2.0 OR BSD-2-Clause
#
# Supports every Braille display that BRLTTY 6.9.1 knows — 39 drivers,
# all connection methods (USB, Bluetooth, serial, HID).
#
# All 39 BRLTTY driver codes (from BRLTTY 6.9.1 source, Drivers/Braille/):
#
#  al  ALVA              BC 640/680, Satellite 544/570/584/Pro
#  at  Albatross         46/80
#  ba  BrailComm         (braille communication devices)
#  bc  BrailleMemo       Pocket/Smart/JD series (Japanese Braille Memo)
#  bd  Braudi            (early USB display)
#  bg  B2G               (Braille to Go)
#  bl  BrailleLite       18/40 (Blazie)
#  bm  Baum/Orbit        Vario 40/70/80, VarioUltra 20/32/40, Pronto! 18/40,
#                        SuperVario, PocketVario, Orbit Reader 20/40,
#                        Refreshabraille 18, BrailleMe 20
#  bn  BrailleNote        mPower, Apex, Touch, Touch+ (HumanWare legacy)
#  cb  CombiBraille       (TSI legacy)
#  ce  Cebra              (braille notetaker)
#  cn  Canute             (Bristol Braille, 360-cell)
#  dp  DotPad             (APH DotPad graphics display)
#  ec  EcoBraille         (older Spanish display)
#  eu  EuroBraille        b.note, b.book, Esys 12/24/40/64/80
#  fa  FrankAudiodata     (German TDI series)
#  fs  FreedomScientific  Focus 14/40/80 Blue, Focus 5th gen 40/80
#  hd  Hedo              MobilLine, ProfiLine, UsB reha
#  hm  HIMS              BrailleSense 6/OnHand/QWERTY/U2, Smart Beetle,
#                        SyncBraille, Braille Edge 40, QBraille XL
#  ht  HandyTech         Active Braille, Basic Braille, Braille Wave,
#                        Easy Braille, Braille Star 40/80, Modular 20/80
#  hw  HumanWare         Brailliant BI 14/32/40/40X/80, B 80,
#                        APH Mantis Q40, APH Chameleon 20, NLS eReader
#                        (HID protocol — newest HumanWare displays)
#  ic  Inceptor          (BrailleMe derivative)
#  ir  Iris              (Humanware Iris)
#  lb  Libbraille        (virtual/generic via libbraille)
#  lt  LogText           (older Tieman display)
#  mb  MiniBraille       (older compact display)
#  md  MDV               MB208/248/408/448 (Italian)
#  mm  MultiBraille      (Tieman MB 325/525)
#  mn  MinTerm           (Braille Mint)
#  mt  Metec             BD-40 (German)
#  np  NinePoint         Harpo BraillePen 12/Touch (Polish, also BBTF resell)
#  pg  Pegasus           PEGASUS 20/27/40/80 (French)
#  pm  Papenmeier        BRAILLEX EL 2D/3D, Tiny/Mobile, Live/Live+
#  sk  Seika             3/5/40/80, Mini 24
#  tn  TechniBraille     Systèmes de Braille (French)
#  ts  TSI               Navigator 20/40/80, PowerBraille 40/65/80
#  tt  TTY               (virtual terminal device)
#  vd  VisioBraille      VisioBraille 20/40 (German)
#  vo  Voyager           (Tieman Voyager 44/70)
#  (xw  XWindow — display-only, not a physical device)
#
# Displays tested on SiliconForest: HumanWare Brailliant BI 40X (hw, HID)

# ---------------------------------------------------------------------------
# Driver selection: auto first, then explicit fallback chain covering all 39
# ---------------------------------------------------------------------------
braille-driver auto,hw,fs,hm,eu,ht,bm,pm,al,sk,np,hd,fa,ic,dp,at,ba,bc,bd,bg,bl,bn,cb,ce,cn,ec,ir,lb,lt,mb,md,mm,mn,mt,pg,tn,ts,tt,vd,vo

# ---------------------------------------------------------------------------
# Connection types: try all in order
# usb:        — USB direct (most modern displays)
# bluetooth:  — Bluetooth (B.note, Smart Beetle, Focus Blue etc.)
# hid:        — HID-over-USB (HumanWare hw driver, newer APH)
# serial:     — RS-232 / USB-Serial adapter (older displays: TSI, Papenmeier)
# ---------------------------------------------------------------------------
braille-device usb: bluetooth: hid: serial:/dev/tty.usbserial serial:/dev/ttyUSB0 serial:/dev/ttyS0

# ---------------------------------------------------------------------------
# BrlAPI server: Python screen reader connects via libbrlapi
# ---------------------------------------------------------------------------
api-server yes
api-parameters auth=none
api-socket-path /tmp/BrlAPI

# ---------------------------------------------------------------------------
# No speech (axserver.py handles TTS via eSpeak-NG)
# ---------------------------------------------------------------------------
speech-driver no

# ---------------------------------------------------------------------------
# Screen driver: not used on SiliconForest (AX events come via Unix socket)
# ---------------------------------------------------------------------------
screen-driver no

# ---------------------------------------------------------------------------
# Text table: German (Florian) — change to 'en' for English
# ---------------------------------------------------------------------------
text-table de

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log-level notice
log-file /tmp/brltty.log
