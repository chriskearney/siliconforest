# brltty.conf — SiliconForest universal Braille display configuration
# Supports ALL displays that macOS/VoiceOver knows, via BRLTTY auto-detection.
#
# macOS-bekannte Braille-Displays (VoiceOver-kompatibel) und ihre BRLTTY-Treiber:
#
# HumanWare:
#   Brailliant BI 14/32/40/40X     -> hw  (HID protocol)
#   Brailliant B 80                -> hw
#   BrailleNote Touch/Touch+       -> hw
#   APH Mantis Q40                 -> hw
#   APH Chameleon 20               -> hw
#   NLS eReader                    -> hw
#
# Freedom Scientific (JAWS):
#   Focus 14/40/80 Blue            -> fs
#   Focus 40/80 5th gen            -> fs
#
# HIMS:
#   BrailleSense series            -> hm
#   Smart Beetle                   -> hm
#   SyncBraille                    -> hm
#   Braille Edge 40                -> hm
#
# Eurobraille:
#   Esys 12/40/64/80               -> eu
#   b.note                         -> eu
#   b.book                         -> eu
#
# Baum / Vario:
#   Vario 40/70/80                 -> bm
#   VarioUltra 20/32/40            -> bm
#   Pronto! 18/40                  -> bm
#   SuperVario/PocketVario         -> bm
#   Orbit Reader 20/40             -> bm
#   Refreshabraille 18             -> bm
#
# ALVA:
#   ALVA 584 Satellite/BC640/BC680 -> al
#
# HandyTech:
#   Active Braille / Easy Braille  -> ht
#   Braille Wave / Basic Braille   -> ht
#
# Papenmeier:
#   BRAILLEX series                -> pm
#
# BrailleMe / Inceptor:
#   BrailleMe 20                   -> bm
#
# Seika:
#   Seika 3/5/40/80, Mini 24       -> sk
#
# BBTF:
#   MyKeyPro                       -> (HID — hw driver or custom)
#
# Harpo:
#   BraillePen 12/Touch            -> np

# BRLTTY auto-detects the display and driver:
braille-driver auto

# Try all common connection methods
braille-device usb: bluetooth:

# BrlAPI for Python screen reader integration
api-server yes
api-parameters auth=none

# No speech (screen reader provides TTS)
speech-driver no

# Screen driver: not needed on SiliconForest (we use AXUIElement directly)
screen-driver no

# Log
log-level notice
log-file /tmp/brltty.log
